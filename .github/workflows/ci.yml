name: Lazy C++ CI (Conditional Testing)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  search-for-changes:
    runs-on: ubuntu-latest
    
    outputs:
      vector: ${{ steps.filter.outputs.vector }}
      deque: ${{ steps.filter.outputs.deque }}
      stack: ${{ steps.filter.outputs.stack }}
      queue: ${{ steps.filter.outputs.queue }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 #загрузить из истории 2 последних коммита

    - name: Check which components changed
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          vector:
            - 'include/my/vector.h'
            - 'tests/test_vector.cpp'
          
          deque:
            - 'include/my/deque.h'
            - 'tests/test_deque.cpp'
          
          stack:
            - 'include/my/stack.h'
            - 'tests/test_stack.cpp'
            - 'include/my/deque.h'
            - 'include/my/vector.h'
          
          queue:
            - 'include/my/queue.h'
            - 'tests/test_queue.cpp'
            - 'include/my/deque.h'

  build-and-test:
    needs: search-for-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false #если упадет Debug, Release всё равно продолжит собираться
      matrix:
        build_type: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-11 cmake

    - name: Configure CMake
      run: |
        mkdir build-${{ matrix.build_type }}
        cmake -B build-${{ matrix.build_type }} -S . -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON

    - name: Build Project (${{ matrix.build_type }})
      run: cmake --build build-${{ matrix.build_type }}

    - name: Run Vector Tests (${{ matrix.build_type }})
      if: ${{ needs.changes.outputs.vector == 'true' }}
      run: cd build-${{ matrix.build_type }} && ctest -R "my_lib_tests\.VectorTests" --output-on-failure

    - name: Run Deque Tests (${{ matrix.build_type }})
      if: ${{ needs.changes.outputs.deque == 'true' }}
      run: cd build-${{ matrix.build_type }} && ctest -R "my_lib_tests\.DequeTests" --output-on-failure

    - name: Run Stack Tests (${{ matrix.build_type }})
      if: ${{ needs.changes.outputs.stack == 'true' }}
      run: cd build-${{ matrix.build_type }} && ctest -R "my_lib_tests\.StackTests" --output-on-failure

    - name: Run Queue Tests (${{ matrix.build_type }})
      if: ${{ needs.changes.outputs.queue == 'true' }}
      run: cd build-${{ matrix.build_type }} && ctest -R "my_lib_tests\.QueueTests" --output-on-failure
